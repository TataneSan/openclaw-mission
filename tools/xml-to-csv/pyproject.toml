[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xml-to-csv"
version = "1.0.0"
description = "CLI tool to convert XML files to CSV"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "TataneSan" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = []

[project.scripts]
xml-to-csv = "xml_to_csv.cli:main"

[tool.setuptools.packages.find]
include = ["xml_to_csv*"]
