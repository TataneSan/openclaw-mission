[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "url-encode-cli"
version = "1.0.0"
description = "Percent-encode and decode URL components from args or stdin"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "TataneSan"}]
keywords = ["url", "percent-encoding", "encode", "decode", "uri", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.scripts]
url-encode-cli = "url_encode_cli.cli:main"

[tool.setuptools.packages.find]
include = ["url_encode_cli*"]
