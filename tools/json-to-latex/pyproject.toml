[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "json-to-latex"
version = "1.0.0"
description = "CLI tool to convert JSON arrays to LaTeX tables"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "TataneSan" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.scripts]
json-to-latex = "json_to_latex.cli:main"

[tool.setuptools.packages.find]
include = ["json_to_latex*"]
