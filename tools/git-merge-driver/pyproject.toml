[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "git-merge-driver"
version = "1.0.0"
description = "CLI tool to configure git merge drivers for file types"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "TataneSan" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = []

[project.scripts]
git-merge-driver = "git_merge_driver.cli:main"

[tool.setuptools.packages.find]
include = ["git_merge_driver*"]
