[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "text-acronym"
version = "1.0.0"
description = "Generate acronyms from phrases, with stop-word filtering and expansion lookup"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "TataneSan"}]
keywords = ["acronym", "abbreviation", "initialism", "text"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.scripts]
text-acronym = "text_acronym.cli:main"

[tool.setuptools.packages.find]
include = ["text_acronym*"]
