[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "json-path-get"
version = "1.0.0"
description = "Extract values from JSON using dot/bracket path expressions"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"

[project.scripts]
json-path-get = "json_path_get.cli:main"

[tool.setuptools]
packages = ["json_path_get"]
