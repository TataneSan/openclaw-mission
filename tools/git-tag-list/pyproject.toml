[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "git-tag-list"
version = "1.0.0"
description = "List and analyze git tags: versions, dates, gaps, pre-release detection"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"

[project.scripts]
git-tag-list = "git_tag_list.cli:main"

[tool.setuptools]
packages = ["git_tag_list"]
